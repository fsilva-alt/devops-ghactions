<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Actions no Codespaces</title>
<meta name="description" content="Aprenda GitHub Actions desde o primeiro workflow, com explicações em português, 7 exercícios guiados e 7 opcionais no GitHub Codespaces: testes, build e publicação de um livro de receitas no GitHub Pages.">
<meta name="theme-color" content="#0F120D">
<script>
/* Aplica o tema salvo antes de desenhar a página, para não piscar. */
try { const t = localStorage.getItem('curso-actions-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mesma estrutura visual dos cursos de Git e de Docker; a cor própria deste curso é o verde-limão. */
:root{
  --bg:#0F120D; --panel:#161A13; --panel-2:#1D2219; --ink:#EEF2E6; --ink-2:#C5CCB8; --muted:#8A9380;
  --accent:#C3E84B; --accent-ink:#1A2400; --accent-soft:rgba(195,232,75,.12); --accent-hover:#D3F06E;
  --line:#262C21; --line-2:#363E2F; --blue:#7DB4FF; --amber:#F2C14E; --red:#F07A7A; --green:#7FDDB0;
  --code-bg:#0A0C08; --rail-bg:rgba(15,18,13,.92);
  --display:"Sora","DM Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"DM Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r:10px; --r-s:6px;
  --gutter:clamp(20px,4vw,56px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F6F7F0; --panel:#FFFFFF; --panel-2:#EEF1E4; --ink:#1B2014; --ink-2:#3B4331; --muted:#646D58;
    --accent:#4A7300; --accent-ink:#FFFFFF; --accent-soft:rgba(74,115,0,.10); --accent-hover:#3C5E00;
    --line:#DDE2D0; --line-2:#C5CCB3; --blue:#1F5FBF; --amber:#8A5A00; --red:#B42318; --green:#17714A;
    --code-bg:#F1F3EA; --rail-bg:rgba(246,247,240,.92);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F7F0; --panel:#FFFFFF; --panel-2:#EEF1E4; --ink:#1B2014; --ink-2:#3B4331; --muted:#646D58;
  --accent:#4A7300; --accent-ink:#FFFFFF; --accent-soft:rgba(74,115,0,.10); --accent-hover:#3C5E00;
  --line:#DDE2D0; --line-2:#C5CCB3; --blue:#1F5FBF; --amber:#8A5A00; --red:#B42318; --green:#17714A;
  --code-bg:#F1F3EA; --rail-bg:rgba(246,247,240,.92);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(15px,1.12vw,18.5px);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r-s)}
code,pre,kbd{font-family:var(--mono)}
code{background:var(--panel-2);border-radius:4px;padding:.08em .4em;font-size:.9em;color:var(--accent);white-space:nowrap}
/* código longo (preparado em renderSlide) quebra só nos espaços em vez de vazar da caixa */
code.wrap{white-space:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}
code.wrap span{white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
strong{font-weight:600;color:var(--ink)}
::selection{background:var(--accent);color:var(--accent-ink)}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ---------- Tema claro/escuro (canto superior direito de todas as páginas) ---------- */
.tema{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel);color:var(--ink-2);font-family:var(--mono);font-size:.78em;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s}
.tema:hover{border-color:var(--accent);color:var(--accent)}
.tema svg{width:15px;height:15px;flex:none}
@media (max-width:640px){.tema .rot{display:none}.tema{padding:6px 8px}}

/* ---------- Home ---------- */
#home{padding:var(--gutter);padding-block:clamp(20px,4vh,40px) clamp(32px,6vh,80px);max-width:1280px;margin:0 auto}
.hometop{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-bottom:clamp(24px,5vh,56px);font-family:var(--mono);font-size:.76em;color:var(--muted)}
.hometop a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
.hometop a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.hometop b{color:var(--accent);font-weight:500}
.hero{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;padding-bottom:clamp(24px,4vh,40px);border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,5.5vw,72px);font-weight:700;line-height:1.02}
.hero h1 span{display:block;color:var(--accent);font-weight:500}
.hero .sub{color:var(--ink-2);max-width:58ch;margin-top:18px;font-size:1.05em}
.hero .meta{display:flex;gap:28px;font-family:var(--mono);font-size:.78em;color:var(--muted);text-align:left}
.hero .meta b{display:block;color:var(--ink);font-size:1.9em;font-family:var(--display);font-weight:600;line-height:1.1;margin-bottom:2px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:10px 28px;margin:24px 0 20px;font-family:var(--mono);font-size:.78em;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--line-2);vertical-align:0;margin-right:8px}
.legend .sw.el{background:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;color:var(--ink);text-decoration:none;min-height:180px;transition:border-color .15s ease,background .15s ease}
.tile:hover,.tile:focus-visible{border-color:var(--accent);background:var(--panel-2);outline:none}
.tile .num{font-family:var(--mono);font-size:.82em;color:var(--accent);letter-spacing:.06em}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile .mod{font-family:var(--mono);font-size:.68em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;line-height:1.4}
.tile h3{font-size:clamp(18px,1.4vw,21px);font-weight:600;line-height:1.25}
.tile .cmds{font-family:var(--mono);font-size:.76em;color:var(--muted);line-height:1.6}
.tile .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-family:var(--mono);font-size:.72em;color:var(--muted)}
.tile .optional{color:var(--amber)}
.homefoot{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px 32px;font-family:var(--mono);font-size:.76em;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.homefoot a{color:var(--ink-2)}
kbd{display:inline-block;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:.9em;color:var(--ink-2);line-height:1.6;margin:0 2px;background:var(--panel)}

/* ---------- Deck ---------- */
#deck{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gutter);border-bottom:1px solid var(--line);background:var(--rail-bg);backdrop-filter:blur(8px);font-family:var(--mono);font-size:.78em;position:sticky;top:0;z-index:5}
.rail.bottom{border-bottom:0;border-top:1px solid var(--line);position:sticky;bottom:0}
.rail .crumb{color:var(--muted);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .crumb b{color:var(--ink-2);font-weight:500}
.rail .right{display:flex;align-items:center;gap:12px}
.rail .tema{font-size:1em}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-s);background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:1em;padding:8px 14px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn[disabled]{opacity:.3;pointer-events:none}
.counter{font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:3px;border-radius:2px;background:var(--line-2);display:block}
.dots i.on{background:var(--accent)}
.slide{padding:clamp(28px,5vh,56px) var(--gutter);max-width:1200px;margin:0 auto;width:100%;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide,.tile,.btn,.tema{animation:none;transition:none}}
.slide .eyebrow{font-family:var(--mono);font-size:.74em;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:12px}
.slide h2{font-size:clamp(26px,3.4vw,44px);margin-bottom:clamp(20px,3.5vh,36px);font-weight:600}
.slide h3{font-size:clamp(15px,1.15vw,17px);font-weight:600;letter-spacing:0;margin-bottom:10px;color:var(--ink)}
.lead{font-size:clamp(17px,1.45vw,22px);max-width:60ch;line-height:1.5;color:var(--ink-2);font-weight:400}
.lead strong,.lead em{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(16px,2vw,28px);align-items:start}
.cols.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cols.s2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:820px){.cols.s2{grid-template-columns:1fr}}
/* minmax(0,…) e min-width:0: uma linha longa de comando rola dentro do bloco em vez de alargar a coluna */
.cols>*{min-width:0}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,2vh,22px)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:clamp(16px,1.6vw,22px)}
.box.lift{border-color:var(--line-2);background:var(--panel-2)}
.box.soft{background:transparent}
.box p{color:var(--ink-2)}
.box p+p{margin-top:.6em}
.callout{border-left:2px solid var(--accent);padding:4px 0 4px 16px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--amber)}
.callout.warn strong{color:var(--amber)}
.callout strong{color:var(--accent)}
pre.cmd{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;font-size:clamp(13px,1vw,15.5px);line-height:1.6;overflow-x:auto;color:var(--ink)}
pre.cmd .p{color:var(--accent);user-select:none}
pre.cmd .c{color:var(--muted)}
pre.cmd .o{color:var(--muted)}
pre.cmd .add{color:var(--green)}
pre.cmd .del{color:var(--red)}
pre.cmd .mk{color:var(--amber)}
pre.cmd .k{color:var(--accent)}
pre.cmd .x{color:var(--amber)}
.file{font-family:var(--mono);font-size:.72em;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.76em;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-2);padding:4px 12px;background:transparent}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8em;color:var(--accent);border:1px solid var(--line-2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:3px}
.steps li .t{margin-bottom:8px;color:var(--ink-2)}
.steps li>div{color:var(--ink-2)}
.steps pre.cmd{padding:10px 14px}
table.kv{width:100%;border-collapse:collapse;font-size:.94em}
table.kv th,table.kv td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
table.kv tr:last-child td{border-bottom:0}
table.kv th{font-family:var(--mono);font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:.7em;color:var(--muted)}
table.kv th:empty{padding:0;border:0}
table.kv td:first-child{font-family:var(--mono);color:var(--accent);white-space:nowrap;font-size:.9em}
.tw{overflow-x:auto}
ul.links{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.links li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
ul.links li::before{content:"↗";color:var(--muted);font-family:var(--mono);font-size:.9em}
ul.links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2)}
ul.links a:hover{color:var(--accent);border-bottom-color:var(--accent)}
ul.links small{display:block;color:var(--muted);font-family:var(--mono);font-size:.76em;margin-top:2px}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:6px;color:var(--ink-2)}
.big{font-family:var(--mono);font-size:.8em;color:var(--accent);letter-spacing:.1em}
.big::before{content:"Exercício "}
details{border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-family:var(--mono);color:var(--amber);letter-spacing:.04em;font-size:.8em}
details[open] summary{margin-bottom:10px}

/* Diagramas de fluxo: evento → workflow → jobs, e o grafo de uma execução */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;justify-content:center}
.flow .node{flex:1 1 150px;min-width:150px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);padding:14px;display:grid;gap:4px;align-content:center;text-align:center}
.flow .node b{font-family:var(--display);font-weight:600;font-size:.98em;color:var(--ink)}
.flow .node small{color:var(--muted);font-family:var(--mono);font-size:.72em;line-height:1.4}
.flow .node.hi{border-color:var(--accent);background:var(--accent-soft)}
.flow .node.blue{border-color:var(--blue)}
.flow .node.dim{border-color:var(--line);color:var(--muted)}
.flow .node.warn{border-color:var(--amber);border-style:dashed}
.flow .node.ok{border-color:var(--green)}
.flow .node.ok b::before{content:"✓ ";color:var(--green)}
.flow .node.fail{border-color:var(--red)}
.flow .node.fail b::before{content:"✗ ";color:var(--red)}
.flow .node.skip{border-style:dashed;border-color:var(--line-2)}
.flow .node.skip b{color:var(--muted)}
.flow .node.skip b::before{content:"⊘ "}
.flow .arr{flex:0 0 auto;display:grid;place-items:center;font-family:var(--mono);font-size:.72em;color:var(--muted);text-align:center;padding:0 6px;gap:2px}
.flow .arr strong{color:var(--accent);font-weight:500}
.flow .arr .a{font-size:1.6em;line-height:1;color:var(--accent)}
.flow .arr.back .a{color:var(--amber)}
@media (max-width:640px){.flow{flex-direction:column}.flow .arr .a{transform:rotate(90deg)}}
/* a caixa "runner": um grupo de nós com borda tracejada e rótulo */
.netbox{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px 14px 14px;position:relative;margin-top:10px}
.netbox::before{content:attr(data-label);position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 8px;font-family:var(--mono);font-size:.72em;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}

/* Linha do tempo (introdução) */
.timeline{list-style:none;margin:clamp(28px,5vh,48px) 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.timeline li{border-top:2px solid var(--line-2);padding-top:20px;min-width:0}
.timeline .date{display:block;font-family:var(--mono);font-size:.8em;color:var(--muted);margin-bottom:20px}
.timeline h3{font-size:clamp(20px,2vw,26px);margin-bottom:12px}
.timeline p{color:var(--ink-2);max-width:32ch}
.timeline .hi{border-color:var(--accent)}
.timeline .hi .date{color:var(--accent)}
@media (max-width:700px){.timeline{grid-template-columns:1fr;gap:24px}.timeline li{border-top:0;border-left:2px solid var(--line-2);padding:0 0 0 20px}.timeline .date{margin-bottom:8px}.timeline p{max-width:none}}

/* Tópicos dentro dos cartões: frases curtas no lugar de parágrafos */
ul.topics{list-style:none;margin:0;padding:0;display:grid;gap:8px;color:var(--ink-2)}
ul.topics li{position:relative;padding-left:16px;line-height:1.45}
ul.topics li::before{content:"";position:absolute;left:1px;top:.6em;width:6px;height:6px;border-radius:2px;background:var(--accent);opacity:.8}

/* Anatomia de um workflow: as peças aninhadas, como no diagrama da documentação do GitHub */
.anat{display:grid;grid-template-columns:minmax(0,11em) auto minmax(0,1fr);align-items:center;gap:10px;margin:0}
.anat .camada{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-width:0}
.anat .cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0;color:var(--ink-2)}
.anat .cab b{font-family:var(--display);font-weight:600;color:var(--ink)}
.anat .cab small{flex-basis:100%;color:var(--muted);font-size:.8em;line-height:1.4}
.anat .camada.ev{border-color:var(--amber)}
.anat .camada.wf{border-color:var(--accent);background:var(--accent-soft)}
.anat .runners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17em),1fr));gap:12px}
.anat .camada.rn{border:1px dashed var(--blue);background:var(--panel)}
.anat .camada.jb{background:var(--panel-2)}
.anat ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.anat li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--code-bg);padding:6px 8px;min-width:0}
.anat li code{flex:1;min-width:0;background:none;padding:0;color:var(--ink);font-size:.78em;white-space:normal;overflow-wrap:anywhere}
.anat .seta{display:grid;place-items:center;gap:2px;font-family:var(--mono);font-size:.72em;color:var(--muted)}
.anat .seta .a{font-size:1.6em;line-height:1;color:var(--accent)}
@media (max-width:760px){.anat{grid-template-columns:minmax(0,1fr)}.anat .seta .a{transform:rotate(90deg)}}
.peca{font-family:var(--mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.peca.ev{color:var(--amber)}
.peca.wf{color:var(--accent)}
.peca.rn{color:var(--blue)}
.peca.jb{color:var(--green)}
.peca.st{color:var(--ink-2)}
.peca.ac,.peca.cm{border:1px solid var(--line-2);border-radius:999px;padding:0 7px;letter-spacing:.04em;text-transform:none}
.peca.ac{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.anat-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19em),1fr));gap:10px 28px}
.anat-leg li{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;align-items:baseline;color:var(--ink-2);font-size:.94em;line-height:1.45}
.anat-leg .peca{justify-self:start}

/* Exercícios opcionais, para praticar depois da aula */
.legend .sw.op{background:var(--blue)}
.tile .opc{color:var(--blue)}
@media (max-width:540px){.rail{padding-inline:12px;gap:8px}.rail .crumb{display:none}.btn{padding:8px 10px}.dots{display:none}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Os slides precisam de JavaScript. Os enunciados resumidos também estão no <a href="https://github.com/fsilva-alt/devops-ghactions#sequência-da-aula">README do curso</a>.</p></noscript>
<main id="home"></main>

<script>
/* ---------- helpers ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Command block: lines starting with "$ " become prompt lines; "# " comment lines; "+ "/"- " diff lines; "> " output lines.
function cmd(text){
  const lines = text.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n');
  return '<pre class="cmd">' + lines.map(l=>{
    if (l.startsWith('$ ')) return '<span class="p">$ </span>' + esc(l.slice(2));
    if (/^\s*#/.test(l)) return '<span class="c">' + esc(l) + '</span>';
    if (l.startsWith('+ ')) return '<span class="add">' + esc(l) + '</span>';
    if (l.startsWith('- ')) return '<span class="del">' + esc(l) + '</span>';
    if (l.startsWith('> ')) return '<span class="o">' + esc(l.slice(2)) + '</span>';
    return esc(l);
  }).join('\n') + '</pre>';
}

// Conteúdo de arquivo YAML: chaves em destaque, comentários apagados e ${{ }} em âmbar.
// Vai no editor, não no terminal; o rótulo diz em qual arquivo.
function yaml(text, arquivo='.github/workflows/ci.yml'){
  const lines = text.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n');
  return (arquivo?`<div class="file">${esc(arquivo)}</div>`:'') + '<pre class="cmd">' + lines.map(l=>{
    const m = l.match(/^(\s*)(#.*)$/);
    if (m) return m[1] + '<span class="c">' + esc(m[2]) + '</span>';
    return esc(l)
      .replace(/^(\s*(?:-\s+)?)([A-Za-z_][\w.-]*)(:)(?=\s|$)/, '$1<span class="k">$2</span>$3')
      .replace(/\$\{\{[^}]*\}\}/g, s => '<span class="x">' + s + '</span>');
  }).join('\n') + '</pre>';
}

// Conteúdo de um arquivo comum (Markdown, Python), com o nome em cima.
function arquivo(nome, text){
  return `<div class="file">${esc(nome)}</div><pre class="cmd">${esc(text.replace(/^\n/,'').replace(/\n\s*$/,''))}</pre>`;
}

// Grafo de jobs de uma execução: [{t:'testar', s:'3 testes', st:'ok'|'fail'|'skip'|'hi'}]
function jobs(lista, seta='needs'){
  return '<div class="flow">' + lista.map((j,i)=>
    (i?`<div class="arr"><span class="a">→</span>${seta}</div>`:'') +
    `<div class="node ${j.st||''}"><b>${j.t}</b>${j.s?`<small>${j.s}</small>`:''}</div>`).join('') + '</div>';
}

function docs(items){
  return '<p style="margin-bottom:14px;color:var(--muted)">Links para consultar depois. A documentação do GitHub tem versão em português.</p><ul class="links">' + items.map(i=>`<li><div><a href="${i.href}" target="_blank" rel="noopener">${i.t}</a>${i.s?`<small>${i.s}</small>`:''}</div></li>`).join('') + '</ul>';
}
function kv(rows, head=['Comando','Para quê']){
  return `<div class="tw"><table class="kv"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<code>${esc(c)}</code>`:c}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
}
function steps(items){ return '<ol class="steps">' + items.map(i=>`<li><div>${i}</div></li>`).join('') + '</ol>'; }
function topicos(items){ return '<ul class="topics">' + items.map(i=>`<li>${i}</li>`).join('') + '</ul>'; }
function chips(list, cls=''){ return `<div class="chips">${list.map(c=>`<span class="chip ${cls}">${esc(c)}</span>`).join('')}</div>`; }

// Standard cover slide for a exercício.
function cover(d, objetivo, onde, extra=''){
  const nn = String(d.n).padStart(2,'0');
  return `<div class="cols s2"><div class="stack">
    <div class="big">${nn}</div>
    <p class="lead">${objetivo}</p>
    ${chips(d.cmds)}
    ${extra}
  </div><div class="stack">
    <div class="box lift"><h3>Onde fazer</h3>${onde}</div>
    <div class="box soft"><h3>Para este exercício</h3>${kv([['⏱ tempo', `${d.time} min${d.antes?' · antes da aula':''}${d.opcional?' · opcional':''}`],['módulo', d.mod],['verificação', `<code>check.sh ${nn}</code>`],['entrega', d.entrega]], ['',''])}${d.opcional?'<p style="margin-top:12px">Exercício opcional: pode ser feito depois da aula, em qualquer ordem. O laboratório já vem com o ponto de partida.</p>':''}</div>
  </div></div>`;
}
const lab = (nn, nome) => `<p>No terminal do Codespace, na pasta do laboratório:</p>${cmd('$ cd ~/labs/' + nn + '-' + nome)}`;
const qualquer = '<p>No terminal do Codespace, em <strong>qualquer pasta</strong>. Estes comandos conferem as ferramentas do Codespace e não dependem de arquivos da pasta atual.</p>';
const verificacao = (nn, texto) => `<div class="box"><h3>Verificação</h3>${cmd('$ check.sh ' + nn)}<p style="margin-top:10px;color:var(--muted)">${texto}</p></div>`;
const publicar = nn => cmd(`$ git add .github/workflows/ci.yml
$ git commit -m "Configura workflow do exercício ${nn}"
$ gh repo create actions-${nn} --public --source=. --remote=origin --push
$ gh browse --actions`);
</script>

<script>
/* ---------- tema claro/escuro ---------- */
const TEMA = 'curso-actions-tema';
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const temaAtual = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function desenharTema(){
  const t = temaAtual(), outro = t === 'light' ? 'escuro' : 'claro';
  document.querySelectorAll('.tema').forEach(b => {
    b.innerHTML = `${t === 'light' ? SOL : LUA}<span class="rot">tema ${t === 'light' ? 'claro' : 'escuro'}</span>`;
    b.setAttribute('aria-label', `Tema ${t === 'light' ? 'claro' : 'escuro'} ativo. Mudar para o tema ${outro}`);
    b.title = `Mudar para o tema ${outro}`;
  });
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
document.addEventListener('click', e => {
  if (!e.target.closest('.tema')) return;
  const t = temaAtual() === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(TEMA, t); } catch (err) {}
  desenharTema();
});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', desenharTema);

/* ---------- app: home + router ---------- */
const ALL = [INTRO, ...D];
const byKey = k => ALL.find(d => String(d.key) === String(k));
const pad = n => typeof n === 'number' ? String(n).padStart(2,'0') : n;

function renderHome(){
  const aula = D.filter(d=>!d.antes && !d.opcional);
  const opcionais = D.filter(d=>d.opcional);
  const total = aula.reduce((a,d)=>a+d.time,0);
  const tiles = ALL.map(d => {
    const isIntro = d.key === 'intro';
    const rodape = d.antes ? '<span class="optional">Antes da aula</span>' : d.opcional ? '<span class="opc">Opcional</span>' : `<span>${d.slides.length} slides</span>`;
    return `<a class="tile" href="#/d/${d.key}/1"${d.opcional?' title="Exercício opcional · pode ser feito depois da aula"':''}>
      <div class="row"><div class="num">${isIntro?'∅':pad(d.n)}</div><div class="mod">${d.mod}</div></div>
      <div><h3>${isIntro? d.short : d.title}</h3><div class="cmds" style="margin-top:8px">${d.cmds.map(esc).join(' · ')}</div></div>
      <div class="foot">${rodape}<span>⏱ ${d.time} min</span></div>
    </a>`;
  }).join('');
  document.getElementById('home').innerHTML = `
    <div class="hometop">
      <button class="tema" type="button"></button>
    </div>
    <header class="hero">
      <div><h1>GitHub Actions<span>no Codespaces</span></h1>
        <p class="sub">Curso de GitHub Actions para iniciantes</p></div>
      <div class="meta"><div><b>${aula.length}</b>exercícios</div><div><b>${total}</b>min de prática</div><div><b>3h</b>de aula</div><div><b>+${opcionais.length}</b>opcionais</div></div>
    </header>
    <div class="legend"><span><span class="sw"></span>exercício</span><span><span class="sw el"></span>exercício 0 · feito antes da aula</span><span><span class="sw op"></span>${opcionais.length} opcionais · para praticar depois da aula</span><span>teclado: <kbd>→</kbd> <kbd>←</kbd> mudar de slide · <kbd>Esc</kbd> voltar ao início · <kbd>F</kbd> tela cheia</span></div>
    <div class="grid">${tiles}</div>
    <footer class="homefoot">
      <span>Faça o exercício 0 antes da aula. Ordem da aula: introdução → 1 → 7, com intervalo depois do 4. Os exercícios ${pad(opcionais[0].n)} a ${pad(opcionais[opcionais.length-1].n)} são opcionais e podem ser feitos em qualquer ordem.</span>
      <span>Gabarito, guia do aluno e scripts: <a href="https://github.com/fsilva-alt/devops-ghactions" target="_blank" rel="noopener">github.com/fsilva-alt/devops-ghactions</a></span>
      <span>Leitura sugerida: <a href="https://docs.github.com/pt/actions" target="_blank" rel="noopener">Documentação do GitHub Actions (pt-br)</a></span>
    </footer>`;
  desenharTema();
}

let cur = null; // {d, i}
function renderSlide(d, i){
  const s = d.slides[i];
  const n = d.slides.length;
  const isIntro = d.key === 'intro';
  document.getElementById('crumb').innerHTML = `${isIntro?'<b>Introdução</b>':`Exercício <b>${pad(d.n)}</b> · <b>${esc(d.title)}</b>`}<span style="opacity:.6"> · ${esc(s.h)}</span>`;
  document.getElementById('counter').textContent = `${i+1} / ${n}`;
  document.getElementById('dots').innerHTML = d.slides.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
  const el = document.getElementById('slide');
  el.innerHTML = `<div class="eyebrow">${esc(s.eyebrow || (isIntro? 'Introdução' : `Exercício ${pad(d.n)} · ${d.mod}`))}${d.opcional?' · Opcional':''}</div><h2>${s.h}</h2>${s.body}`;
  // Até 29 caracteres o código cabe inteiro em qualquer caixa; acima disso pode quebrar,
  // mas só nos espaços, para "--public" não virar "--" e "public" em linhas diferentes.
  // A primeira coluna das tabelas continua sem quebra: ela rola dentro de .tw.
  el.querySelectorAll('code').forEach(c => {
    if (c.textContent.length < 30 || c.closest('td:first-child')) return;
    c.replaceChildren(...c.textContent.split(' ').flatMap((w, k) => {
      const s = document.createElement('span'); s.textContent = w;
      return k ? [' ', s] : [s];
    }));
    c.classList.add('wrap');
  });
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  const prev = document.getElementById('btnPrev'), next = document.getElementById('btnNext');
  const idx = ALL.indexOf(d), last = i === n-1;
  // No primeiro slide, "Anterior" volta ao último slide do exercício anterior, como "Próximo" avança.
  if (i === 0 && idx > 0){ const pd = ALL[idx-1]; prev.innerHTML = `← ${pd.key==='intro'?'Introdução':'Exercício '+pad(pd.n)}`; prev.dataset.goto = `#/d/${pd.key}/${pd.slides.length}`; }
  else { prev.innerHTML = '← Anterior'; delete prev.dataset.goto; }
  prev.toggleAttribute('disabled', i === 0 && idx === 0);
  if (last && idx < ALL.length-1){ const nd = ALL[idx+1]; next.innerHTML = `${nd.key==='intro'?'Introdução':'Exercício '+pad(nd.n)} →`; next.dataset.goto = `#/d/${nd.key}/1`; }
  else if (last){ next.innerHTML = 'Exercícios ↑'; next.dataset.goto = '#/'; }
  else { next.innerHTML = 'Próximo →'; delete next.dataset.goto; }
  window.scrollTo({top:0});
}

function route(){
  const h = location.hash || '#/';
  // Endereços da versão anterior dos slides: #intro, #modulo-NN (conceitos) e #exercicio-NN (tarefa).
  const antigo = h.match(/^#(intro|modulo-(\d{2})|exercicio-(\d{2}))/);
  if (antigo){
    const d = byKey(antigo[1] === 'intro' ? 'intro' : (antigo[2] || antigo[3]));
    if (d){ location.replace(`#/d/${d.key}/${antigo[3] ? d.slides.length : 1}`); return; }
  }
  const m = h.match(/^#\/d\/([^/]+)(?:\/(\d+))?/);
  const home = document.getElementById('home'), deck = document.getElementById('deck');
  if (m && byKey(m[1])){
    const d = byKey(m[1]);
    let i = Math.min(Math.max((parseInt(m[2]||'1',10)||1)-1, 0), d.slides.length-1);
    cur = {d, i};
    home.classList.add('hidden'); deck.classList.remove('hidden');
    renderSlide(d, i);
    document.title = `${d.key==='intro'?'Introdução':'Exercício '+pad(d.n)} · ${d.title} — GitHub Actions no Codespaces`;
  } else {
    cur = null;
    deck.classList.add('hidden'); home.classList.remove('hidden');
    document.title = 'GitHub Actions no Codespaces';
    if (h !== '#/') history.replaceState(null,'','#/');
  }
}
function go(delta){
  if (!cur) return;
  const {d, i} = cur;
  const ni = i + delta;
  if (ni < 0){
    const prev = document.getElementById('btnPrev');
    if (prev.dataset.goto) location.hash = prev.dataset.goto;
    return;
  }
  if (ni >= d.slides.length){
    const next = document.getElementById('btnNext');
    if (next.dataset.goto) location.hash = next.dataset.goto;
    return;
  }
  location.hash = `#/d/${d.key}/${ni+1}`;
}

document.getElementById('btnPrev').addEventListener('click', ()=>go(-1));
document.getElementById('btnNext').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName) && e.key === ' ') return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  switch (e.key){
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': if (cur){ e.preventDefault(); go(1);} break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': if (cur){ e.preventDefault(); go(-1);} break;
    case 'Escape': case 'h': case 'H': location.hash = '#/'; break;
    case 'f': case 'F': (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()); break;
    case 'Home': if (cur){ location.hash = `#/d/${cur.d.key}/1`; } break;
    case 'End': if (cur){ location.hash = `#/d/${cur.d.key}/${cur.d.slides.length}`; } break;
  }
});
// swipe
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null || !cur) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('hashchange', route);
renderHome();
route();
</script>
</body>
</html>
